<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Blogverse</title>
  <meta name="description" content="Sign in to your Blogverse creator account to publish, curate, and engage with technical stories.">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar" id="site-header">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">
          <i class="fa-solid fa-feather-pointed"></i>
        </div>
        <span>Blog<span class="text-gradient">verse</span></span>
      </a>

      <nav class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="create-blog.html" class="nav-link">Write</a>
      </nav>

      <div class="nav-actions">
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme">
          <i class="fa-solid fa-sun"></i>
        </button>
        <div id="nav-user-area"></div>
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 480px;">

      <div class="form-card animate-fade-in" id="login-container">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 46px; height: 46px; font-size: 1.4rem;">
            <i class="fa-solid fa-feather-pointed"></i>
          </div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Welcome Back</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">
            Enter your credentials to access your creator dashboard.
          </p>
        </div>

        <!-- 1-Click Demo Login Shortcut -->
        <div style="margin-bottom: 1.5rem; background: var(--primary-light); border: 1px dashed var(--primary); padding: 0.85rem; border-radius: var(--radius-md); text-align: center;">
          <div style="font-size: 0.8rem; font-weight: 600; color: var(--primary); margin-bottom: 0.4rem;">
            ⚡ INSTANT TESTING
          </div>
          <button type="button" class="btn btn-primary btn-sm demo-login-btn" id="demo-login-btn" style="width: 100%;">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>1-Click Demo Login (Alex Rivera)</span>
          </button>
        </div>

        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase;">
          <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
          <span>Or with email</span>
          <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        </div>

        <!-- Error feedback banner -->
        <div id="auth-error-alert" style="display: none; background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); color: var(--accent-rose); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1.25rem;"></div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <div class="form-input-icon-wrapper">
              <i class="fa-regular fa-envelope input-icon-left"></i>
              <input 
                type="email" 
                id="login-email" 
                class="form-input" 
                placeholder="name@example.com" 
                value="alex@example.com"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label for="login-password" class="form-label">Password</label>
              <a href="#" style="font-size: 0.8rem; color: var(--primary);" onclick="alert('For demo purposes, you can use any password or click the 1-Click Demo Login button above.'); return false;">Forgot?</a>
            </div>
            <div class="form-input-icon-wrapper">
              <i class="fa-solid fa-lock input-icon-left"></i>
              <input 
                type="password" 
                id="login-password" 
                class="form-input" 
                placeholder="••••••••" 
                value="demo1234"
                required
              >
              <button type="button" class="input-toggle-btn" data-target="login-password" aria-label="Show password">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
            <span>Sign In to Blogverse</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
          Don't have an account yet? 
          <a href="register.html" style="font-weight: 600;">Sign Up</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Core Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
